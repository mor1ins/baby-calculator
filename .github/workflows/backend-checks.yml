name: Backend checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: baby_test
          POSTGRES_PASSWORD: baby_test
          POSTGRES_DB: baby_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baby_test -d baby_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.9.26
      - run: make setup
      - run: make check
      - run: make test-integration
        env:
          BABY_TEST_DATABASE_URL: postgresql+psycopg://baby_test:baby_test@127.0.0.1:5432/baby_test
